name: Release

# Parte solo quando pushi un tag che inizia per "v" (v0.1.0, v0.2.0, v1.0.0...).
# Un push normale su main non fa scattare niente.
on:
  push:
    tags:
      - "v*"

# Di default il workflow può solo leggere il repo.
# Per creare una release deve poterci scrivere.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # 1. Scarica il codice del repo dentro la macchina temporanea.
      #    Senza questo passo la macchina è vuota.
      - uses: actions/checkout@v7

      # 2. Crea uno zip per ogni cartella dentro skills/.
      #    Aggiungi una skill domani e finisce nella release senza toccare questo file.
      - name: Crea uno zip per skill
        run: |
          mkdir -p dist
          cd skills
          for d in */; do
            name="${d%/}"
            zip -q -r "../dist/${name}.zip" "$name" -x '.*'
            echo "creato ${name}.zip"
          done

      # 3. Pubblica la release sul tag appena pushato e allega gli zip.
      #    fail_on_unmatched_files: se il passo 2 non ha prodotto niente,
      #    meglio un errore rosso che una release vuota pubblicata in silenzio.
      - name: Pubblica la release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
