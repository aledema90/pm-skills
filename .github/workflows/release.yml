name: Release

# Runs only when a tag starting with "v" is pushed (v0.1.0, v0.2.0, v1.0.0...).
# Ordinary pushes to main don't trigger anything.
on:
  push:
    tags:
      - "v*"

# Workflows are read-only by default; creating a release needs write access.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # 1. Check the repo out into the runner, which otherwise starts empty.
      - uses: actions/checkout@v7

      # 2. Build one zip per folder in skills/.
      #    Add a skill tomorrow and it ships without touching this file.
      - name: Build one zip per skill
        run: |
          mkdir -p dist
          cd skills
          for d in */; do
            name="${d%/}"
            zip -q -r "../dist/${name}.zip" "$name" -x '.*'
            echo "built ${name}.zip"
          done

      # 3. Publish the release on the pushed tag with the zips attached.
      #    fail_on_unmatched_files: if step 2 produced nothing, fail loudly
      #    rather than publishing an empty release in silence.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
